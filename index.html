<!DOCTYPE html>   
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOAT ReportPro Download</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  padding: 10px;
  margin: 0;
}

#formContainer {
  max-width: 500px;
  width: 100%;
  margin: 20px auto;
  background: #ffffff;
  border-radius: 10px;
  padding: 30px 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  box-sizing: border-box;
}

.logo {
  text-align: center;
  margin-bottom: 20px;
}

.logo img {
  max-width: 120px;
  width: 30%;
  height: auto;
  display: block;
  margin: 0 auto;
}

.logo-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: bold;
  color: #004080;
}

.logo-subtitle {
  font-size: 14px;
  color: #666;
  margin-top: 4px;
  font-style: italic;
}

.back-home {
  display: inline-block;
  margin-bottom: 20px;
  text-decoration: none;
  color: #004080;
  font-size: 14px;
  font-weight: bold;
}

.back-home:hover {
  text-decoration: underline;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #004080;
  font-size: 20px;
}

.form-row {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.form-row input {
  flex: 1;
}

input {
  padding: 12px 14px;
  font-size: 15px;
  border-radius: 5px;
  border: 1px solid #ccc;
  width: 100%;
  box-sizing: border-box;
}

input:focus {
  border-color: #0066ff;
  outline: none;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 5px;
  border: none;
  background: #0066ff;
  color: #fff;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #0051cc;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#downloadLink {
  display: none;
  margin-top: 20px;
}

#downloadLink a {
  display: block;
  text-align: center;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 5px;
  text-decoration: none;
  background: linear-gradient(135deg, #28a745, #1e7e34);
  color: white;
}

#downloadLink a:hover {
  transform: scale(1.02);
}

#message {
  display: none;
  padding: 12px;
  margin-top: 10px;
  border-radius: 5px;
  font-size: 14px;
  text-align: center;
}

.error {
  background: #fdecea;
  color: #a94442;
}

.success {
  background: #e6fffa;
  color: #155724;
}

@media (max-width: 600px) {
  .form-row {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div id="formContainer">

<a href="https://joatsms.github.io/joat-sms/" class="back-home">← Back to Home</a>

<div class="logo">
  <img src="Mylogo.png" alt="Logo">
  <div class="logo-title">JOAT ReportPro</div>
  <div class="logo-subtitle">Official 2026 Release</div>
</div>

<h2>Fill Your Info to Download</h2>

<div class="form-row">
  <input type="text" id="school" placeholder="School Name">
  <input type="text" id="country" placeholder="Country">
</div>

<div class="form-row">
  <input type="text" id="region" placeholder="Region / State">
  <input type="email" id="email" placeholder="Email Address">
</div>

<div id="message"></div>

<button id="submitBtn" onclick="submitForm()">Submit & Get Download</button>

<div id="downloadLink">
  <a id="downloadBtn" href="https://github.com/JOATACADEMY/reportpro/releases/download/v1.0/JOAT_ReportPro_Setup.zip" target="_blank">
    ⬇ Download JOAT ReportPro v1.0 (163 MB)
  </a>
</div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzUfQHzdcWcxZ57Amh37-9Xq5A2GWShS_VeuIzIc4GZXgQrzQbxqXmCZslTbDiVqmkISA/exec";

const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function showMessage(text, type) {
  const msg = document.getElementById("message");
  msg.innerText = text;
  msg.className = type;
  msg.style.display = "block";
}

function submitForm() {
  const school = document.getElementById("school").value.trim();
  const country = document.getElementById("country").value.trim();
  const region = document.getElementById("region").value.trim();
  const email = document.getElementById("email").value.trim();
  const btn = document.getElementById("submitBtn");

  if (btn.disabled) return;

  if (!school || !country || !region || !email) {
    showMessage("All fields are required.", "error");
    return;
  }

  if (!EMAIL_REGEX.test(email)) {
    showMessage("Enter a valid email address.", "error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Processing...";
  showMessage("Submitting your information...", "success");

  fetch(WEB_APP_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ school, country, region, email })
  })
  .then(() => {
    showMessage("Submission successful. Download ready.", "success");

    document.getElementById("downloadLink").style.display = "block";
    document.getElementById("downloadLink").scrollIntoView({ behavior: "smooth" });

    btn.disabled = false;
    btn.innerText = "Submit & Get Download";
  })
  .catch(() => {
    showMessage("Network error. Try again.", "error");
    btn.disabled = false;
    btn.innerText = "Submit & Get Download";
  });
}
</script>

</body>
</html>
